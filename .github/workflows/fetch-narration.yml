name: Fetch narration (MP3)

# One-off helper: downloads the approved ElevenLabs narration from a (temporary, signed) URL
# onto the runner, analyses the pauses, and commits the MP3 to the branch.
on:
  workflow_dispatch:
  push:
    branches: ["video-02/**"]
    paths: [".github/narration-url.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download MP3
        run: |
          AUDIO_URL="$(cat .github/narration-url.txt)"
          mkdir -p public/audio/video-02
          curl -fsSL --retry 3 -o public/audio/video-02/narration.mp3 "$AUDIO_URL"
          ls -l public/audio/video-02/narration.mp3
          ffprobe -v error -show_entries format=duration,bit_rate -of default=nw=1 public/audio/video-02/narration.mp3

      - name: Analyse pauses (silencedetect)
        run: |
          ffmpeg -hide_banner -i public/audio/video-02/narration.mp3 -af "silencedetect=noise=-38dB:d=0.35" -f null - 2>&1 \
            | grep -E "silence_(start|end)|Duration" > content/video-02-narration-analysis.txt || true
          cat content/video-02-narration-analysis.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/narration-url.txt || true
          git add public/audio/video-02/narration.mp3 content/video-02-narration-analysis.txt
          git commit -m "Add approved narration (ElevenLabs Mona) + pause analysis"
          git push origin HEAD:${{ github.ref_name }}
